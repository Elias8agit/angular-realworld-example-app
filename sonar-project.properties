# Configuración del análisis en SonarQube Cloud
# Verifique ambos valores en SonarQube Cloud: Administration > Information
sonar.projectKey=Elias8agit_angular-realworld-example-app
sonar.organization=elias8agit
sonar.projectName=angular-realworld-example-app

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/*.spec.ts,src/test.ts
sonar.sourceEncoding=UTF-8

# Si en el futuro se agregan pruebas, la cobertura se tomaría de aquí
sonar.javascript.lcov.reportPaths=coverage/lcov.info
